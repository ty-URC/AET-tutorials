[project]
name = "aet-tutorials"
version = "0.1.0"
description = "Atomic electron tomography tutorials: GENFIRE and RESIRE reconstruction of an alloy nanoparticle"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tomokazu Yamamoto" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "mrcfile>=1.4",
    "pyfftw>=0.13",
    "jupyterlab>=4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
